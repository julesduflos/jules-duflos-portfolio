<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jules Duflos - Portfolio</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --text-color: #f4f4f4;
      --accent-color: #888;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      padding: 2rem 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* --- HEADER & NAVIGATION --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 3rem;
      position: relative;
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0.5rem 0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dropdown-btn:hover {
      color: var(--accent-color);
    }

    .dropdown-content {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .dropdown-container.active .dropdown-content {
      max-height: 150px;
      opacity: 1;
    }

    .dropdown-content a {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .dropdown-content a:hover {
      color: var(--text-color);
    }

    /* --- SECTION VIDÉOS (GRILLE) --- */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2.5rem 2rem;
      margin-bottom: 4rem;
    }

    .video-item {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* La 5ème vidéo est centrée en bas */
    .video-item.centered {
      grid-column: 1 / -1;
      max-width: calc(50% - 1rem);
      margin: 0 auto;
      width: 100%;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--accent-color);
      padding: 0 0.2rem;
    }

    /* --- SECTION PHOTOGRAPHIE --- */
    .photo-section {
      margin-top: 5rem;
    }

    .photo-section h2 {
      font-size: 1.2rem;
      font-weight: 400;
      margin-bottom: 1.5rem;
      text-align: left;
      color: var(--text-color);
    }

    .photos-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1rem;
    }

    .photo-item {
      aspect-ratio: 4 / 3;
      background-color: #1a1a1a;
      border-radius: 4px;
      overflow: hidden;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Responsive mobile */
    @media (max-width: 768px) {
      .videos-grid {
        grid-template-columns: 1fr;
      }
      .video-item.centered {
        max-width: 100%;
      }
      .photos-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
