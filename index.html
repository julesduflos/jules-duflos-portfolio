    <!-- Script simple pour gérer les menus déroulants -->
    <script>
        function toggleDropdown(id) {
            // Ferme tous les autres menus ouverts
            const dropdowns = document.getElementsByClassName("dropdown-content");
            for (let i = 0; i < dropdowns.length; i++) {
                let openDropdown = dropdowns[i];
                if (openDropdown.id !== id) {
                    openDropdown.classList.remove('show');
                }
            }
            // Alterne l'état du menu ciblé
            document.getElementById(id).classList.toggle("show");
        }

        // Ferme les menus si on clique en dehors
        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-btn') && !event.target.matches('.dropdown-section-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
